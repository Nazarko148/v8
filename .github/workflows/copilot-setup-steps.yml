name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read
    env:
      GCLIENT_ROOT: ${{ github.workspace }}/..
      V8_CHECKOUT: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adb git ninja-build unzip

      - name: Install depot_tools
        env:
          DEPOT_TOOLS_DIR: ${{ runner.temp }}/depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "VPYTHON_BYPASS=manually managed python not supported by chrome operations" >> "$GITHUB_ENV"

      - name: Create gclient workspace for Android
        working-directory: ${{ env.GCLIENT_ROOT }}
        run: |
          cat > .gclient <<'EOF'
          solutions = [
            {
              "name": "v8",
              "url": "https://chromium.googlesource.com/v8/v8.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {},
            },
          ]
          target_os = ["android", "unix"]
          EOF

      - name: Sync repository dependencies and Android toolchains
        working-directory: ${{ env.GCLIENT_ROOT }}
        run: |
          test "$PWD/v8" = "$V8_CHECKOUT"
          gclient sync --no-history

      - name: Export Android tool locations
        run: |
          test -d "$V8_CHECKOUT/third_party/android_sdk/public"
          test -d "$V8_CHECKOUT/third_party/android_ndk"
          echo "ANDROID_SDK_ROOT=$V8_CHECKOUT/third_party/android_sdk/public" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$V8_CHECKOUT/third_party/android_sdk/public" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$V8_CHECKOUT/third_party/android_ndk" >> "$GITHUB_ENV"
          echo "$V8_CHECKOUT/third_party/android_sdk/public/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android GN configuration
        run: |
          python3 tools/dev/v8gen.py gen android.arm64.release -m client.v8 -b 'V8 Android Arm64 - builder'
          grep 'target_os = "android"' out.gn/android.arm64.release/args.gn
